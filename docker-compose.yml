version: '3.11'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      - BROKER_URL=redis://redis:6379/0

  agent:
    build:
      context: .
      dockerfile: Agent/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    pid: "host"
    environment:
      - BROKER_URL=redis://redis:6379/0